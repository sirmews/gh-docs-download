command = """
git commit -m "$(cat <<'EOF'
Implement LLM-friendly Rust architecture with comprehensive refactoring

This commit transforms the gh-docs-download project from a monolithic 545-line
main.rs into a modular, LLM-optimized Rust codebase following established
best practices for AI-assisted development.

## Key Architectural Changes

### Module Organization
- Split monolithic main.rs into focused modules (<200 lines each):
  - src/lib.rs: Public API and library documentation
  - src/error.rs: Comprehensive error types with thiserror
  - src/types.rs: Semantic newtypes for domain modeling
  - src/github.rs: GitHub API client with clean interfaces
  - src/downloader.rs: Core download logic and file handling
  - src/cli.rs: Command-line interface with validation
  - src/main.rs: Minimal binary entry point (7 lines)

### Type Safety & Semantic Modeling
- Replace primitive strings with semantic newtypes:
  RepoOwner, RepoName, FileName, FilePath, DownloadUrl, FileSizeBytes,
  GitHubToken, DocsDirectory
- Add validation logic and proper error handling for all domain types
- Implement Display, From, and other traits for ergonomic usage

### Error Handling Excellence
- Replace Box<dyn std::error::Error> with GitHubDocsError enum
- Add specific error variants: ApiRequestFailed, RateLimitExceeded,
  RepositoryNotFound, DownloadFailed, GitOperationFailed, InvalidRepoFormat
- Implement error context and helper methods for error classification

### Clean Async Patterns
- Replace manual Box::pin async recursion with #[async_recursion]
- Clean up lifetime management in recursive functions
- Maintain functionality while improving readability

### Comprehensive Documentation
- Add extensive rustdoc comments with examples for all public APIs
- Include field-level documentation for all public struct fields
- Document all error variants and enum cases
- Enable #![warn(missing_docs)] for documentation completeness
- Create library-level documentation with quickstart examples

### Development Infrastructure
- Update Cargo.toml with thiserror, async-recursion dependencies
- Add URL serde support for proper serialization
- Configure clippy linting with practical restrictions
- Enhance Makefile with test-unit, test-doc, docs, strict lint targets

## Quality Assurance
- All tests pass: 6 unit tests + 2 documentation tests
- Clippy compliance: Code compiles with warnings-as-errors
- Functional verification: Tool works correctly with real repositories
- Backward compatibility: CLI interface unchanged for users

## LLM-Friendly Benefits Achieved
- Context Preservation: Focused modules with clear separation of concerns
- Semantic Clarity: Types express domain concepts preventing category errors
- Predictable Structure: Consistent patterns LLMs can recognize and replicate
- Error Transparency: Explicit error types provide actionable information
- Documentation-Driven: Comprehensive docs support AI code understanding

This refactoring demonstrates best practices from the LLM-friendly Rust
development guide and serves as a reference implementation for AI-optimized
Rust project structure.
EOF
)""""
