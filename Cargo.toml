[package]
name = "gh-docs-download"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A CLI tool to download documentation files from GitHub repositories"
repository = "https://github.com/yourusername/gh-docs-download"
license = "MIT"
keywords = ["github", "documentation", "download", "cli", "docs"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive", "serde_derive", "rc"] }
serde_json = "1.0.141"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
url = { version = "2.4", features = ["serde"] }
regex = "1.10"
tempfile = "3.8"
walkdir = "2.4"
thiserror = "1.0"
async-recursion = "1.0"

[lints.clippy]
all = "warn"
pedantic = "warn"
cargo = "warn"
# Disable overly strict lints for practical development
multiple_crate_versions = "allow"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"