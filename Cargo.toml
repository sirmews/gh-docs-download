[package]
name = "gh-docs-download"
version = "0.2.0"
edition = "2021"
authors = ["Navishkar Rao <sirmews@gmail.com>"]
description = "Efficient CLI tool for downloading documentation from GitHub repositories using git sparse checkout. Perfect for RAG applications and documentation collection."
repository = "https://github.com/sirmews/gh-docs-download"
homepage = "https://github.com/sirmews/gh-docs-download"
documentation = "https://docs.rs/gh-docs-download"
readme = "README.md"
license = "MIT"
keywords = ["github", "documentation", "cli", "git", "rag"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".claude-hook-advisor.toml",
    "docs/",
    "target/",
    ".git/",
    "*.log"
]

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive", "serde_derive", "rc"] }
url = { version = "2.4", features = ["serde"] }
tempfile = "3.8"
walkdir = "2.4"
thiserror = "1.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Disable overly strict lints for practical development
multiple_crate_versions = "allow"
missing_docs_in_private_items = "allow"
